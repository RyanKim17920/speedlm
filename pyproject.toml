[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Pinned runtime stack (NOT declared as dependencies)
# ---------------------------------------------------------------------------
# These packages are installed out-of-band on the GPU host and are deliberately
# NOT listed in project.dependencies. The wrapper itself only needs
# fastapi / httpx / uvicorn at runtime; the heavy weights come from the host.
#
#   Python            3.12
#   vllm              0.25.1+cu129
#   speculators        v0.6.0  (from source)
#   torch              2.11.0
#   CUDA               12.9
# ---------------------------------------------------------------------------

[project]
name = "speedlm"
version = "0.1.0"
description = "near-drop-in replacement for `vllm serve` that captures traffic as traces and fine-tunes a speculative draft head during idle GPU time"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "hypothesis",
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
speedlm = "speedlm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/speedlm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra prints the reason for every non-passing outcome (skipped, xfailed, xpassed,
# failed, errored) on EVERY run. Without it, plain "-q" reported e.g.
# "1109 passed" while >200 tests were silently skipped, including whole modules
# that collected as zero tests behind a module-level pytest.importorskip. A skip
# is a test that did not run; it has to be visible or the suite reports green for
# coverage it does not have.
#
# Deliberately NOT adding `-m "not e2e"`: deselected tests print no reason at all
# and are invisible to -ra, which is exactly the failure mode being fixed here.
# The e2e tests are gated on environment variables and GPU availability, so with
# -ra they now announce themselves by name and reason on every run, and they stay
# runnable by simply setting those variables.
addopts = "-q -ra"
pythonpath = ["src"]
markers = [
    "e2e: real end-to-end tests that require a live GPU and vLLM server",
    "no_torch: runs in the project venv too (uses torch-free fakes)",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src/speedlm"]

# Activation-capture modules import torch/safetensors/vllm lazily at runtime.
# They execute inside the separate vLLM venv (/admin/home/ryan.kim/speedlm/.preflight/venvs/vllm/)
# where these packages are installed. The project venv only has fastapi/httpx/uvicorn
# (see project.dependencies above) — adding torch here would break that minimal env.
[[tool.mypy.overrides]]
module = ["torch.*", "torch"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["safetensors.*", "safetensors"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["vllm.*", "vllm"]
ignore_missing_imports = true
