[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Pinned runtime stack (NOT declared as dependencies)
# ---------------------------------------------------------------------------
# These packages are installed out-of-band on the GPU host and are deliberately
# NOT listed in project.dependencies. The wrapper itself only needs
# fastapi / httpx / uvicorn at runtime; the heavy weights come from the host.
#
#   Python            3.12
#   vllm              0.25.1+cu129
#   speculators        v0.6.0  (from source)
#   torch              2.11.0
#   CUDA               12.9
# ---------------------------------------------------------------------------

[project]
name = "speedlm"
version = "0.1.0"
description = "near-drop-in replacement for `vllm serve` that captures traffic as traces and fine-tunes a speculative draft head during idle GPU time"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
speedlm = "speedlm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/speedlm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = [
    "e2e: real end-to-end tests that require a live GPU and vLLM server",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src/speedlm"]
