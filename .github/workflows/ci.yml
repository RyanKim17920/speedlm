name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      # NEVER remove this exclusion: tests/e2e requires an H100 GPU plus a live
      # vLLM process and will never run in CI.
      - name: Run unit tests
        run: python -m pytest -m "not e2e"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy
